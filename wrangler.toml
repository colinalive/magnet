# cili.xyz - Cloudflare Workers Configuration
name = "cili-xyz"
main = "worker.js"
compatibility_date = "2024-01-01"

# Static assets (Pages-style)
[assets]
directory = "./"

# Production environment
[env.production]
routes = [
    { pattern = "cili.xyz", custom_domain = true },
    { pattern = "www.cili.xyz", custom_domain = true }
]
