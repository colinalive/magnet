<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ePark Search</title>
    <meta name="description" content="Professional Magnet Search Engine">
    <style>
        :root { --primary: #0070f3; --bg: #fff; --text: #333; }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        
        /* 顶部语言栏 */
        .top-nav { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .lang-btn { border: none; background: none; color: #666; cursor: pointer; font-size: 13px; }
        .lang-btn.active { color: var(--primary); font-weight: bold; }

        /* 居中容器 */
        .center-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; margin-top: -50px; }
        
        .logo { font-size: 48px; font-weight: 800; margin-bottom: 30px; color: #000; letter-spacing: -1px; }
        .logo span { color: var(--primary); }
        
        .search-box { width: 100%; max-width: 580px; position: relative; }
        input { width: 100%; padding: 16px 20px; padding-right: 100px; border: 1px solid #dfe1e5; border-radius: 24px; font-size: 16px; outline: none; box-sizing: border-box; transition: box-shadow 0.2s; }
        input:hover, input:focus { box-shadow: 0 1px 6px rgba(32,33,36,0.28); border-color: rgba(223,225,229,0); }
        
        button { position: absolute; right: 6px; top: 6px; height: 36px; padding: 0 20px; background: var(--primary); color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: 500; font-size: 14px; }
        button:hover { background: #0060df; }

        .footer { text-align: center; font-size: 12px; color: #999; padding-bottom: 20px; }
    </style>
</head>
<body>

<div class="top-nav">
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
    <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
    <button class="lang-btn" data-lang="ko" onclick="setLang('ko')">한국어</button>
</div>

<div class="center-container">
    <div class="logo">⚡ <span>ePark</span></div>
    <div class="search-box">
        <input type="text" id="searchInput" autofocus onkeypress="handleEnter(event)">
        <button id="btnSearch" onclick="goSearch()">Search</button>
    </div>
</div>

<div class="footer">&copy; 2026 ePark Search</div>

<script src="main.js"></script>
<script>
    // 初始化语言
    const t = initI18n();

    function handleEnter(e) { if(e.key === 'Enter') goSearch(); }

    function goSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if(!q) return;
        // 🔥 核心跳转逻辑：带上语言参数
        const lang = getLang();
        window.location.href = `search.html?q=${encodeURIComponent(q)}&lang=${lang}`;
    }
</script>

</body>
</html>
