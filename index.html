<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cili.xyz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.6.6/css/flag-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 仅保留极少量 Bootstrap 无法覆盖的微调 */
        .hover-shadow:hover { box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
        .transition-base { transition: all .3s ease; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/">
                <i class="fa-solid fa-bolt me-2"></i>Cili.xyz
            </a>
            <div class="d-flex align-items-center" id="flagContainer">
                </div>
        </div>
    </nav>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="container text-center">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="mb-4">
                        <i class="fa-solid fa-magnet fa-4x text-primary mb-3"></i>
                        <h1 class="fw-bold mb-2">Cili.xyz</h1>
                        <p class="text-secondary lead" data-i18n="hero_title">Discover Anything</p>
                    </div>

                    <div class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden border">
                        <span class="input-group-text bg-white border-0 ps-4">
                            <i class="fa-solid fa-magnifying-glass text-muted"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control border-0 shadow-none" data-i18n="search_placeholder" placeholder="...">
                        <button class="btn btn-primary px-4 fw-bold" onclick="doSearch()" data-i18n="search_btn">Search</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 text-center text-muted small">
        <div class="container">
            &copy; 2026 Cili.xyz
        </div>
    </footer>

    <script src="/main.js"></script>
</body>
</html>
