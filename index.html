<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cili.xyz - Discover Anything</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.6.6/css/flag-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar-clean">
        <div class="nav-container">
            <a href="/" class="brand-logo">cili<span>.xyz</span></a>
            <div class="lang-flags" id="flagContainer"></div>
        </div>
    </nav>

    <div class="hero-section">
        <div style="margin-bottom: 40px;">
            <i class="fa-solid fa-bolt fa-4x" style="color: var(--brand-color); margin-bottom: 20px;"></i>
            <h1 class="brand-logo" style="font-size: 3rem; margin: 0;">cili<span>.xyz</span></h1>
            <p style="color: var(--text-muted); margin-top: 10px;" data-i18n="hero_title">Discover Anything</p>
        </div>

        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" data-i18n="search_placeholder" placeholder="Type to search...">
            <button class="search-btn" onclick="doSearch()" data-i18n="search_btn">Search</button>
        </div>
        
        <div style="margin-top: 30px; display:flex; gap:10px; justify-content:center;">
            <a href="/search/4k" class="tag">4K Movie</a>
            <a href="/search/ubuntu" class="tag">Ubuntu</a>
            <a href="/search/lossless" class="tag">Lossless Audio</a>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
