<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁力先锋 - cili.xyz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="description" content="Global verified torrent search engine.">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div class="container flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="text-center w-100" style="max-width: 600px;">
            <h1 class="display-3 fw-bold mb-4">⚡ cili.xyz</h1>
            
            <div class="input-group input-group-lg shadow-sm">
                <input type="text" id="searchInput" class="form-control" autofocus onkeypress="handleEnter(event)">
                <button class="btn btn-primary px-4" id="btnSearch" onclick="goSearch()">Search</button>
            </div>
            
            <div class="mt-5">
                <div class="btn-group shadow-sm" role="group">
                    <button class="btn btn-light border lang-btn" data-lang="en" onclick="setLang('en')" title="English">🇺🇸</button>
                    <button class="btn btn-light border lang-btn" data-lang="zh-CN" onclick="setLang('zh-CN')" title="简体中文">🇨🇳</button>
                    <button class="btn btn-light border lang-btn" data-lang="zh-TW" onclick="setLang('zh-TW')" title="繁體中文(HK)">🇭🇰</button>
                    <button class="btn btn-light border lang-btn" data-lang="ja" onclick="setLang('ja')" title="日本語">🇯🇵</button>
                    <button class="btn btn-light border lang-btn" data-lang="ko" onclick="setLang('ko')" title="한국어">🇰🇷</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-3 text-muted border-top bg-white small">
        &copy; 2026 磁力先锋 (Magnet Pioneer)
    </footer>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.initPage();
        });
    </script>
</body>
</html>
