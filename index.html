<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0071e3">

    <!-- SEO Meta Tags (will be updated by JS) -->
    <title>cili.xyz - Magnet Pioneer</title>
    <meta name="description" content="cili.xyz - Fast and reliable magnet link search engine. Find torrents quickly and easily.">
    <meta name="keywords" content="magnet, torrent, search, download, cili, magnet link">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="cili.xyz">
    <meta property="og:title" content="cili.xyz - Magnet Pioneer">
    <meta property="og:description" content="Fast and reliable magnet link search engine">
    <meta property="og:url" content="https://cili.xyz">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="cili.xyz - Magnet Pioneer">
    <meta name="twitter:description" content="Fast and reliable magnet link search engine">

    <!-- Canonical -->
    <link rel="canonical" href="https://cili.xyz">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="/" class="nav-brand">⚡ cili.xyz</a>
            <div class="nav-actions" id="navActions">
                <!-- Language selector injected by JS -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <div class="main-hero">
            <h1 class="hero-title" id="heroTitle">cili<span>.xyz</span></h1>
            <p class="hero-subtitle" id="heroSubtitle">Magnet Pioneer: Indexing the Future</p>

            <div class="search-hero">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search for torrents..."
                    autocomplete="off"
                    autofocus
                >
                <button id="searchBtn" class="search-btn">Search</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!-- Footer content injected by JS -->
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = window.App;
            const t = app.t;

            // Update page content with translations
            document.documentElement.lang = app.lang;
            document.getElementById('heroTitle').innerHTML = t.heroTitle;
            document.getElementById('heroSubtitle').textContent = t.heroSubtitle;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('searchBtn').textContent = t.searchButton;

            // Inject language selector
            document.getElementById('navActions').innerHTML = app.generateLangSelector();
            app.initLangSelector();

            // Inject footer
            document.getElementById('footer').outerHTML = app.generateFooter();

            // Update SEO
            app.updateSEO({
                title: `${t.siteName} - ${t.siteTitle}`,
                description: t.metaDescription
            });

            // Search functionality
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            function doSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = `/search/${encodeURIComponent(query)}`;
                }
            }

            searchBtn.addEventListener('click', doSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') doSearch();
            });
        });
    </script>
</body>
</html>
