<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitSearch - Discover</title>
    <meta name="description" content="Minimalist, high-speed search for global resources.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-apple">
        <div class="container">
            <a class="navbar-brand navbar-brand-text ls-tight" href="index.html">
                BitSearch
            </a>
            
            <div class="dropdown ms-auto">
                <button class="btn btn-lang-minimal dropdown-toggle" type="button" data-bs-toggle="dropdown" id="currentLangLabel">
                    English
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-4 mt-2">
                    <li><a class="dropdown-item lang-item py-2" href="#" data-lang="zh-CN">简体中文</a></li>
                    <li><a class="dropdown-item lang-item py-2" href="#" data-lang="en">English</a></li>
                    </ul>
            </div>
        </div>
    </nav>

    <div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 75vh;">
        
        <h1 class="display-3 fw-bold mb-3 text-center ls-tight" data-i18n="hero_title" style="color: var(--text-primary);">
            Discover Anything.
        </h1>
        <p class="lead text-secondary mb-5 text-center" data-i18n="hero_subtitle" style="max-width: 600px;">
            Fast, clean, and intelligent search powered by global cloud caching.
        </p>

        <div class="search-container-hero w-100">
            <div class="input-group-apple d-flex">
                <input type="text" id="searchInput" class="form-control input-apple shadow-none" data-i18n="search_placeholder" placeholder="Search movies, software, resources...">
                <button id="searchBtn" class="btn-search-apple" data-i18n="search_btn">Search</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
