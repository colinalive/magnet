<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁力先锋 - cili.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css" rel="stylesheet" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: #fff; }
        .apple-blur { background: rgba(255, 255, 255, 0.7); backdrop-filter: saturate(180%) blur(20px); }
        .search-home { background: #f5f5f7; border-radius: 20px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .search-home:focus { background: #fff; box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.2); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<nav class="apple-blur fixed w-full z-50 top-0 border-b border-gray-100">
    <div class="max-w-screen-xl flex items-center justify-between mx-auto p-4">
        <span class="text-xl font-bold tracking-tight">⚡ cili.xyz</span>
        <div class="flex items-center">
            <button id="langDrop" data-dropdown-toggle="langList" class="text-xl px-3 py-1 bg-gray-100 rounded-full hover:bg-gray-200 transition-colors">
                <span id="curFlag">🇺🇸</span>
            </button>
            <div id="langList" class="z-10 hidden bg-white rounded-2xl shadow-xl w-40 border border-gray-100 overflow-hidden">
                <ul class="py-2 text-sm font-medium">
                    <li><button onclick="changeLang('en')" class="w-full px-4 py-3 hover:bg-gray-50 text-left">🇺🇸 English</button></li>
                    <li><button onclick="changeLang('zh-CN')" class="w-full px-4 py-3 hover:bg-gray-50 text-left">🇨🇳 简体中文</button></li>
                    <li><button onclick="changeLang('zh-TW')" class="w-full px-4 py-3 hover:bg-gray-50 text-left">🇭🇰 繁體中文</button></li>
                    <li><button onclick="changeLang('ja')" class="w-full px-4 py-3 hover:bg-gray-50 text-left">🇯🇵 日本語</button></li>
                    <li><button onclick="changeLang('ko')" class="w-full px-4 py-3 hover:bg-gray-50 text-left">🇰🇷 한국어</button></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<main class="flex-grow flex flex-col items-center justify-center px-4">
    <div class="w-full max-w-2xl text-center">
        <h1 class="text-6xl md:text-8xl font-extrabold tracking-tighter mb-4 text-black">cili<span class="text-blue-600">.xyz</span></h1>
        <p id="sub" class="text-xl text-gray-500 mb-12">Magnet Pioneer: Indexing the Future.</p>
        <div class="relative">
            <input type="text" id="searchInput" class="search-home w-full p-5 text-xl border-none outline-none" autofocus onkeypress="if(event.key === 'Enter') doSearch()">
            <button onclick="doSearch()" class="absolute right-3 top-3 bg-blue-600 text-white rounded-2xl px-8 py-2.5 font-bold hover:scale-105 transition-transform" id="btnS">Search</button>
        </div>
    </div>
</main>

<footer class="py-10 border-t border-gray-100 text-center text-sm text-gray-400">
    <div class="mb-2">© 2026 磁力先锋 (cili.xyz). All rights reserved.</div>
    <div class="space-x-4 font-medium"><a href="#">DMCA</a><a href="#">Privacy</a><a href="#">Support</a></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>
<script>
    const i18n = {
        'en': { search: "Search", sub: "Magnet Pioneer: Indexing the Future.", flag: "🇺🇸" },
        'zh-CN': { search: "搜索", sub: "磁力先锋：索引未来资源", flag: "🇨🇳" },
        'zh-TW': { search: "搜尋", sub: "磁力先鋒：索引未來資源", flag: "🇭🇰" },
        'ja': { search: "検索", sub: "マグネットパイオニア：未来をインデックス", flag: "🇯🇵" },
        'ko': { search: "검색", sub: "마그넷 파이오니어: 미래를 색인하다", flag: "🇰🇷" }
    };

    function getLang() {
        let s = localStorage.getItem('cili_lang');
        if (s) return s;
        const n = navigator.language.toLowerCase();
        if (n.includes('tw') || n.includes('hk')) return 'zh-TW';
        if (n.includes('zh')) return 'zh-CN';
        if (n.includes('ja')) return 'ja';
        if (n.includes('ko')) return 'ko';
        return 'en';
    }

    function changeLang(l) { localStorage.setItem('cili_lang', l); location.reload(); }

    document.addEventListener('DOMContentLoaded', () => {
        const L = getLang(); const t = i18n[L];
        document.getElementById('searchInput').placeholder = t.search + "...";
        document.getElementById('btnS').textContent = t.search;
        document.getElementById('sub').textContent = t.sub;
        document.getElementById('curFlag').textContent = t.flag;
    });

    function doSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if(q) location.href = `search.html?q=${encodeURIComponent(q)}`;
    }
</script>
</body>
</html>
