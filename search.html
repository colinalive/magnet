<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁力先锋 - 搜索结果</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css" rel="stylesheet" />
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; }
        .apple-nav { background: rgba(255, 255, 255, 0.75); backdrop-filter: saturate(180%) blur(20px); }
        .card-apple { border-radius: 18px; transition: transform 0.3s cubic-bezier(0,0,0.5,1); }
        .card-apple:hover { transform: scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.06); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

<nav class="apple-nav fixed w-full z-50 top-0 border-b border-gray-100 p-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
        <a href="index.html" class="text-xl font-bold">⚡ cili.xyz</a>
        <div class="flex-grow max-w-md mx-4 relative">
            <input type="text" id="searchInput" class="w-full bg-gray-100 border-none rounded-xl p-2 px-4 focus:bg-white focus:ring-2 focus:ring-blue-500 transition-all" onkeypress="if(event.key === 'Enter') startS()">
        </div>
        <button id="langDrop" data-dropdown-toggle="langList" class="text-lg">🇺🇸</button>
    </div>
</nav>

<main class="mt-24 px-4 max-w-4xl mx-auto flex-grow w-full">
    <div id="status" class="text-center py-20 text-gray-400">Searching...</div>
    <div id="results" class="space-y-4"></div>
</main>

<footer class="py-10 border-t bg-white text-center text-sm text-gray-400">
    © 2026 磁力先锋 (cili.xyz). Powered by BitSearch.
</footer>

<div id="langList" class="hidden bg-white rounded-xl shadow-lg w-32 border overflow-hidden">
    <ul class="py-2 text-sm text-gray-700">
        <li><button onclick="setL('en')" class="w-full px-4 py-2 hover:bg-gray-100">🇺🇸 EN</button></li>
        <li><button onclick="setL('zh-CN')" class="w-full px-4 py-2 hover:bg-gray-100">🇨🇳 中文</button></li>
    </ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>
<script>
    const API_BASE = 'https://api.cili.xyz'; 
    function setL(l){ localStorage.setItem('cili_lang', l); location.reload(); }

    document.addEventListener('DOMContentLoaded', () => {
        const q = new URLSearchParams(window.location.search).get('q');
        if(q) { document.getElementById('searchInput').value = q; startS(q); }
    });

    async function startS(v) {
        const q = v || document.getElementById('searchInput').value;
        const resList = document.getElementById('results');
        const status = document.getElementById('status');
        status.style.display = 'block'; resList.innerHTML = '';
        
        try {
            const res = await fetch(`${API_BASE}/?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            status.style.display = 'none';
            if(!data.length) { status.textContent = "No Results Found"; return; }

            resList.innerHTML = data.map(item => `
                <div class="card-apple bg-white p-6 shadow-sm cursor-pointer" onclick="view('${item.infohash}', '${btoa(encodeURIComponent(JSON.stringify(item)))}')">
                    <h3 class="text-blue-600 text-lg font-bold mb-2 hover:underline">${item.name}</h3>
                    <div class="flex gap-4 text-xs font-medium text-gray-500">
                        <span class="bg-gray-100 px-2 py-1 rounded">💾 ${item.size}</span>
                        <span class="text-green-600">⬆ ${item.seeders}</span>
                        <span>📅 ${item.date}</span>
                        ${item.verified ? '<span class="text-blue-500">Verified ✅</span>' : ''}
                    </div>
                </div>
            `).join('');
        } catch(e) { status.textContent = "API Connection Error"; }
    }

    function view(hash, raw) {
        sessionStorage.setItem('cili_res_' + hash, raw);
        location.href = `detail.html?hash=${hash}`;
    }
</script>
</body>
</html>
