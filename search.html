<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - 磁力先锋</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-light bg-white border-bottom sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-none d-md-block" href="index.html">🧲</a>
            
            <div class="d-flex flex-grow-1 mx-md-4">
                <input type="text" id="searchInput" class="form-control me-2" onkeypress="handleEnter(event)">
                <button class="btn btn-outline-primary" id="btnSearch" onclick="goSearch()">Search</button>
            </div>

            <div class="d-none d-md-block">
                 <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-secondary lang-btn" data-lang="en" onclick="setLang('en')">🇺🇸</button>
                    <button class="btn btn-outline-secondary lang-btn" data-lang="zh-CN" onclick="setLang('zh-CN')">🇨🇳</button>
                    <button class="btn btn-outline-secondary lang-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">🇭🇰</button>
                    <button class="btn btn-outline-secondary lang-btn" data-lang="ja" onclick="setLang('ja')">🇯🇵</button>
                    <button class="btn btn-outline-secondary lang-btn" data-lang="ko" onclick="setLang('ko')">🇰🇷</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container d-md-none mt-3 text-center">
         <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary lang-btn" data-lang="en" onclick="setLang('en')">🇺🇸</button>
            <button class="btn btn-outline-secondary lang-btn" data-lang="zh-CN" onclick="setLang('zh-CN')">🇨🇳</button>
            <button class="btn btn-outline-secondary lang-btn" data-lang="zh-TW" onclick="setLang('zh-TW')">🇭🇰</button>
            <button class="btn btn-outline-secondary lang-btn" data-lang="ja" onclick="setLang('ja')">🇯🇵</button>
            <button class="btn btn-outline-secondary lang-btn" data-lang="ko" onclick="setLang('ko')">🇰🇷</button>
        </div>
    </div>

    <div class="container py-4" style="max-width: 900px;">
        <div id="statusAlert" class="alert alert-light text-center border" role="alert">
            Loading...
        </div>
        <div class="list-group shadow-sm" id="resultsList"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const t = window.initPage(); 
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');

            if(q) document.getElementById('searchInput').value = q;
            if(!q) return;
            
            const statusEl = document.getElementById('statusAlert');
            const listEl = document.getElementById('resultsList');
            statusEl.textContent = t.loading;

            try {
                // 请求 API
                const res = await fetch(`${API_BASE}/?q=${encodeURIComponent(q)}`);
                const data = await res.json();

                if(data.error) throw new Error(data.error);
                if(!data || data.length === 0) {
                    statusEl.className = "alert alert-warning text-center";
                    statusEl.textContent = t.empty;
                    return;
                }

                statusEl.style.display = 'none';

                // 渲染结果
                listEl.innerHTML = data.map(item => {
                    const hash = item.infohash;
                    // 生成详情页链接 (传递 Hash 和 Lang)
                    const detailUrl = hash ? `detail.html?hash=${hash}&lang=${window.getLang()}` : '#';
                    
                    const verifiedBadge = item.verified ? `<span class="badge bg-success me-1">✓ ${t.verified}</span>` : '';
                    const hotBadge = (item.downloads > 500) ? `<span class="badge bg-danger me-1">🔥 ${t.hot}</span>` : '';
                    const sizeBadge = `<span class="badge bg-light text-dark border ms-2">${item.size}</span>`;

                    return `
                    <a href="${detailUrl}" class="list-group-item list-group-item-action p-3">
                        <div class="d-flex w-100 justify-content-between align-items-start mb-2">
                            <h5 class="mb-1 text-primary text-break text-decoration-underline-hover">${item.name}</h5>
                            ${sizeBadge}
                        </div>
                        <div class="mb-2">
                            ${verifiedBadge}
                            ${hotBadge}
                            <span class="badge bg-secondary opacity-50">${item.category || 'General'}</span>
                        </div>
                        <div class="d-flex gap-3 small text-muted">
                            <span class="text-success fw-bold">⬆ ${item.seeders}</span>
                            <span class="text-danger">⬇ ${item.leechers}</span>
                            <span>💾 ${item.downloads || 0} ${t.downloads}</span>
                            <span>📅 ${item.date}</span>
                        </div>
                    </a>
                    `;
                }).join('');

            } catch(e) {
                statusEl.className = "alert alert-danger text-center";
                statusEl.textContent = `${t.error}: ${e.message}`;
            }
        });
    </script>
</body>
</html>
