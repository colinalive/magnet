<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - cili.xyz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.6.6/css/flag-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar-clean">
        <div class="nav-container">
            <a href="/" class="brand-logo">cili<span>.xyz</span></a>
            
            <div class="search-wrapper" style="max-width: 500px; margin: 0 20px; padding: 4px; box-shadow: none; border: 1px solid #eee;">
                <input type="text" id="searchInput" class="search-input" style="font-size: 0.95rem; padding: 8px 16px;" placeholder="...">
                <button class="search-btn" onclick="doSearch()" style="padding: 0 20px;"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <div class="lang-flags" id="flagContainer"></div>
        </div>
    </nav>

    <div class="nav-container" style="padding-top: 40px; padding-bottom: 60px;">
        <h2 style="margin-bottom: 20px;" data-i18n="res_found">Results</h2>
        
        <div id="loading" style="text-align: center; padding: 40px;">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--brand-color);"></i>
        </div>

        <div id="resultsList">
            </div>
    </div>

    <script src="/main.js"></script> </body>
</html>
