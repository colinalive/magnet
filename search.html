<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitSearch Clone - Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-glass sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center me-4" href="index.html">
                <i class="fa-solid fa-share-nodes text-gradient me-2 fa-lg"></i> 
                <span style="font-weight: 800;">BITSEARCH</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <div class="flex-grow-1 mx-lg-4 my-2 my-lg-0">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden">
                        <input type="text" id="searchInput" class="form-control border-0 bg-light" data-i18n="search_placeholder" placeholder="Search...">
                        <button class="btn btn-primary px-4" id="searchBtn">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                </div>

                <div class="dropdown ms-lg-3">
                    <button class="btn btn-link text-decoration-none text-dark dropdown-toggle fw-bold" type="button" data-bs-toggle="dropdown" id="currentLangLabel">
                        Language
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li><a class="dropdown-item lang-item" href="#" data-lang="zh-CN">简体中文</a></li>
                        <li><a class="dropdown-item lang-item" href="#" data-lang="zh-TW">繁體中文</a></li>
                        <li><a class="dropdown-item lang-item" href="#" data-lang="en">English</a></li>
                        <li><a class="dropdown-item lang-item" href="#" data-lang="ko">한국어</a></li>
                        <li><a class="dropdown-item lang-item" href="#" data-lang="ja">日本語</a></li>
                        <li><a class="dropdown-item lang-item" href="#" data-lang="es">Español</a></li>
                        <li><a class="dropdown-item lang-item" href="#" data-lang="fr">Français</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="text-muted mb-0">
                <span data-i18n="res_found">Results Found</span>: 
                <span id="resultCount" class="text-dark fw-bold ms-2">...</span>
            </h5>
            
            <div class="d-flex gap-2">
                <select class="form-select form-select-sm border-0 shadow-sm" style="width: auto;">
                    <option data-i18n="sort_by">Sort by</option>
                    <option>Seeders</option>
                    <option>Size</option>
                    <option>Date</option>
                </select>
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-3 small">Searching global network...</p>
        </div>

        <div id="resultsList" class="d-flex flex-column gap-3"></div>
        
        <nav class="mt-5 d-flex justify-content-center">
            <ul class="pagination shadow-sm">
                <li class="page-item disabled"><a class="page-link" href="#">&laquo;</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a class="page-link" href="#">&raquo;</a></li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    
    <script>
        const API_BASE = 'https://api.cili.xyz'; // Ensure this matches your worker URL

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            const list = document.getElementById('resultsList');
            const loading = document.getElementById('loading');
            const countLabel = document.getElementById('resultCount');

            if(query) {
                // Populate search box
                document.getElementById('searchInput').value = query;
                
                try {
                    const res = await fetch(`${API_BASE}/?q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    
                    loading.classList.add('d-none');
                    
                    if(data.error || data.length === 0) {
                        list.innerHTML = `<div class="text-center py-5 text-muted"><i class="fa-regular fa-folder-open fa-3x mb-3"></i><br>No results found.</div>`;
                        countLabel.innerText = "0";
                        return;
                    }

                    countLabel.innerText = data.length;

                    // Render items
                    list.innerHTML = data.map(item => `
                        <div class="card hover-card border-0 shadow-sm">
                            <div class="card-body p-3">
                                <div class="row align-items-center g-3">
                                    <div class="col-auto">
                                        <div class="bg-light rounded-3 p-3 text-secondary">
                                            <i class="fa-solid ${getIcon(item.category)} fa-xl"></i>
                                        </div>
                                    </div>
                                    
                                    <div class="col">
                                        <h6 class="fw-bold mb-1 text-truncate-2">
                                            <a href="detail.html?magnet=${encodeURIComponent(item.magnet)}&name=${encodeURIComponent(item.name)}&size=${encodeURIComponent(item.size)}" class="text-decoration-none text-dark stretched-link">
                                                ${item.name}
                                            </a>
                                        </h6>
                                        <div class="text-muted small d-flex flex-wrap gap-3 mt-2">
                                            <span class="badge bg-light text-dark border fw-normal">${item.category}</span>
                                            <span><i class="fa-solid fa-hard-drive me-1 text-secondary"></i> ${item.size}</span>
                                            <span><i class="fa-solid fa-calendar me-1 text-secondary"></i> ${item.date}</span>
                                        </div>
                                    </div>
                                    
                                    <div class="col-auto text-end" style="z-index: 2; position: relative;">
                                        <div class="d-flex align-items-center gap-3 mb-2 justify-content-end">
                                            <span class="text-success fw-bold small"><i class="fa-solid fa-arrow-up"></i> ${item.seeders}</span>
                                            <span class="text-danger fw-bold small"><i class="fa-solid fa-arrow-down"></i> ${item.leechers}</span>
                                        </div>
                                        <div class="d-flex gap-2">
                                            <a href="${item.magnet}" class="btn btn-sm btn-magnet rounded-pill px-3" title="Magnet Link">
                                                <i class="fa-solid fa-magnet"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');

                } catch (e) {
                    loading.innerHTML = `<div class="text-danger">Error loading results.</div>`;
                    console.error(e);
                }
            }
        });

        function getIcon(cat) {
            if(cat.includes('Video')) return 'fa-film';
            if(cat.includes('Audio')) return 'fa-music';
            if(cat.includes('App')) return 'fa-compact-disc';
            if(cat.includes('Game')) return 'fa-gamepad';
            return 'fa-file';
        }
    </script>
</body>
</html>
