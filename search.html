<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁力先锋 - cili.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css" rel="stylesheet" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; background-color: #f5f5f7; }
        .apple-nav { background: rgba(255, 255, 255, 0.75); backdrop-filter: saturate(180%) blur(20px); border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        .apple-card { border-radius: 20px; border: none; transition: transform 0.3s cubic-bezier(0,0,0.5,1); }
        .apple-card:hover { transform: scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.06); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<nav class="apple-nav fixed w-full z-50 top-0">
    <div class="max-w-4xl flex items-center justify-between mx-auto p-3">
        <a href="index.html" class="text-xl font-bold text-black tracking-tight">⚡ cili.xyz</a>
        <div class="flex items-center">
            <button id="langDrop" data-dropdown-toggle="langList" class="text-lg px-2 py-1 bg-white/50 border rounded-full">🇺🇸</button>
            <div id="langList" class="z-10 hidden bg-white rounded-2xl shadow-xl w-36 border">
                <ul class="py-2 text-sm">
                    <li><button onclick="App.changeLang('en')" class="block w-full px-4 py-2 hover:bg-gray-100">🇺🇸 English</button></li>
                    <li><button onclick="App.changeLang('zh-CN')" class="block w-full px-4 py-2 hover:bg-gray-100">🇨🇳 简体中文</button></li>
                    <li><button onclick="App.changeLang('zh-TW')" class="block w-full px-4 py-2 hover:bg-gray-100">🇭🇰 繁體中文</button></li>
                    <li><button onclick="App.changeLang('ja')" class="block w-full px-4 py-2 hover:bg-gray-100">🇯🇵 日本語</button></li>
                    <li><button onclick="App.changeLang('ko')" class="block w-full px-4 py-2 hover:bg-gray-100">🇰🇷 한국어</button></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<main class="mt-28 px-4 max-w-4xl mx-auto flex-grow w-full">
    <div class="relative mb-12">
        <input type="text" id="searchInput" class="w-full p-5 bg-white border-0 rounded-3xl shadow-sm focus:ring-4 focus:ring-blue-100 transition-all text-xl" placeholder="Search...">
        <button onclick="doSearch()" class="absolute right-3 top-3 bg-blue-600 text-white rounded-2xl px-8 py-2.5 font-bold">Search</button>
    </div>

    <div id="status" class="text-center py-10 hidden"></div>
    <div id="results" class="space-y-5"></div>
</main>

<footer class="mt-20 py-10 border-t bg-white">
    <div class="max-w-4xl mx-auto px-4 text-center text-sm text-gray-400">
        <p class="mb-2">© 2026 磁力先锋 (cili.xyz). All search data is powered by BitSearch Network.</p>
        <div class="space-x-4">
            <a href="#" class="hover:text-black">DMCA</a>
            <a href="#" class="hover:text-black">API</a>
            <a href="#" class="hover:text-black">Privacy</a>
        </div>
    </div>
</footer>

<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const t = App.t;
        document.getElementById('searchInput').placeholder = t.placeholder;
        const q = new URLSearchParams(window.location.search).get('q');
        if(q) {
            document.getElementById('searchInput').value = q;
            doSearch(q);
        }
    });

    async function doSearch(val) {
        const q = val || document.getElementById('searchInput').value;
        if(!q) return;
        
        const resList = document.getElementById('results');
        const status = document.getElementById('status');
        
        status.innerHTML = App.t.loading;
        status.classList.remove('hidden');
        resList.innerHTML = '';

        try {
            const res = await fetch(`${CONFIG.API_BASE}/?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            status.classList.add('hidden');

            if(!data.length) {
                status.classList.remove('hidden');
                status.innerHTML = App.t.empty;
                return;
            }

            resList.innerHTML = data.map(item => `
                <div class="apple-card bg-white p-6 shadow-sm cursor-pointer" onclick="viewDetail('${item.infohash}', '${btoa(encodeURIComponent(JSON.stringify(item)))}')">
                    <h3 class="text-blue-600 text-xl font-bold hover:underline mb-3">${item.name}</h3>
                    <div class="flex flex-wrap gap-5 text-sm font-medium text-gray-500">
                        <span class="bg-gray-100 px-3 py-1 rounded-full">${item.size}</span>
                        <span class="text-green-600">⬆ ${item.seeders}</span>
                        <span>📅 ${item.date}</span>
                        ${item.verified ? `<span class="text-blue-500 font-bold">Verified ✅</span>` : ''}
                    </div>
                </div>
            `).join('');
        } catch(e) {
            status.innerHTML = `<span class="text-red-500">${App.t.error}</span>`;
        }
    }

    function viewDetail(hash, raw) {
        // 详情页传参优化：先存入 sessionStorage，解决 404 隐患
        sessionStorage.setItem('cili_info_' + hash, raw);
        window.location.href = `detail.html?hash=${hash}`;
    }
</script>
</body>
</html>
