<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0071e3">

    <!-- SEO Meta Tags (will be updated by JS) -->
    <title>Search Results - cili.xyz</title>
    <meta name="description" content="Search results on cili.xyz - Fast magnet link search engine">
    <meta name="keywords" content="magnet, torrent, search, download, cili">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="cili.xyz">
    <meta property="og:title" content="Search Results - cili.xyz">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-secondary">
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="/" class="nav-brand">⚡ cili.xyz</a>
            <div class="nav-search">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search..."
                    autocomplete="off"
                >
            </div>
            <div class="nav-actions" id="navActions">
                <!-- Language selector injected by JS -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <div class="main-content">
            <div class="container container-md">
                <!-- Search Header -->
                <div class="mb-6" id="searchHeader" style="display: none;">
                    <h1 class="text-center" style="font-size: 1.5rem; font-weight: 600; color: var(--color-text);">
                        <span id="resultsForText">Results for</span> "<span id="queryDisplay"></span>"
                    </h1>
                    <p id="totalResults" class="text-center mt-4" style="color: var(--color-text-tertiary); font-size: 0.875rem;"></p>
                </div>

                <!-- Status -->
                <div id="status" class="status">
                    <div class="loading"></div>
                    <p class="status-text mt-4" id="statusText">Searching...</p>
                </div>

                <!-- Results List -->
                <div id="results"></div>

                <!-- Pagination -->
                <div id="pagination" class="hidden" style="display: flex; justify-content: center; gap: 12px; margin-top: 32px;"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!-- Footer content injected by JS -->
    </footer>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script>
        let currentQuery = '';
        let currentPage = 1;

        document.addEventListener('DOMContentLoaded', () => {
            const app = window.App;
            const t = app.t;

            // Update page language
            document.documentElement.lang = app.lang;

            // Inject language selector
            document.getElementById('navActions').innerHTML = app.generateLangSelector();
            app.initLangSelector();

            // Inject footer
            document.getElementById('footer').outerHTML = app.generateFooter();

            // Update static translations
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('resultsForText').textContent = t.resultsFor;
            document.getElementById('statusText').textContent = t.searchingText;

            // Get search query and page from URL: /search.html?q={query}&page={page}
            const urlParams = new URLSearchParams(window.location.search);
            currentQuery = urlParams.get('q') || '';
            currentPage = parseInt(urlParams.get('page')) || 1;

            if (!currentQuery) {
                showError(t.noResults);
                return;
            }

            // Set query in search input and display
            document.getElementById('searchInput').value = currentQuery;
            document.getElementById('queryDisplay').textContent = currentQuery;

            // Update SEO
            app.updateSEO({
                title: `"${currentQuery}" - ${t.searchTitle} - ${t.siteName}`,
                description: t.searchMetaDescription.replace('{query}', currentQuery),
                canonical: `https://cili.xyz/search.html?q=${encodeURIComponent(currentQuery)}`
            });

            // Perform search
            performSearch(currentQuery, currentPage);

            // Search input handler
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const newQuery = searchInput.value.trim();
                    if (newQuery && newQuery !== currentQuery) {
                        window.location.href = `/search.html?q=${encodeURIComponent(newQuery)}`;
                    }
                }
            });
        });

        async function performSearch(query, page = 1) {
            const app = window.App;
            const t = app.t;
            const resultsContainer = document.getElementById('results');
            const statusEl = document.getElementById('status');
            const headerEl = document.getElementById('searchHeader');

            try {
                const response = await app.search(query, { page, limit: 20 });

                statusEl.style.display = 'none';

                const results = response.results || response;

                if (!results || results.length === 0) {
                    showError(t.noResults);
                    return;
                }

                headerEl.style.display = 'block';

                // Show total results if available
                if (response.pagination && response.pagination.total) {
                    document.getElementById('totalResults').textContent =
                        `${t.total} ${response.pagination.total.toLocaleString()} ${t.results}`;
                }

                resultsContainer.innerHTML = results.map(item => renderResultCard(item, app)).join('');

                // Render pagination if available
                if (response.pagination && response.pagination.total > 20) {
                    renderPagination(response.pagination, query);
                }

            } catch (error) {
                console.error('Search error:', error);
                showError(t.apiError);
            }
        }

        function renderResultCard(item, app) {
            const t = app.t;
            const name = app.escapeHtml(item.name || 'Unknown');
            const size = app.escapeHtml(item.size || 'Unknown');
            const seeders = item.seeders || 0;
            const leechers = item.leechers || 0;
            const date = item.date ? app.formatDate(item.date) : 'Unknown';
            const category = app.escapeHtml(item.category || 'Other');
            const detailId = String(item.id || item.infohash || '');
            const verified = item.verified;
            const imdb = item.imdb;

            // Cache the item data for detail page
            if (detailId) app.cacheDetail(detailId, item);

            return `
                <div class="result-card" onclick="viewDetail('${detailId}')">
                    <h3 class="result-title">${name}</h3>
                    <div class="result-meta">
                        <span class="result-tag">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            ${size}
                        </span>
                        <span class="result-tag seeds">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 19V5M5 12l7-7 7 7"/>
                            </svg>
                            ${seeders}
                        </span>
                        <span class="result-tag leechers">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12l7 7 7-7"/>
                            </svg>
                            ${leechers}
                        </span>
                        <span class="result-tag">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            ${date}
                        </span>
                        <span class="result-tag">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            ${category}
                        </span>
                        ${verified ? `<span class="result-tag verified">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                            ${t.verified}
                        </span>` : ''}
                        ${imdb && imdb.rating ? `<span class="result-tag" style="background: rgba(245, 197, 24, 0.15); color: #f5c518;">
                            <span style="font-weight: 700;">IMDb</span> ${imdb.rating}
                        </span>` : ''}
                    </div>
                </div>
            `;
        }

        function renderPagination(pagination, query) {
            const t = window.App.t;
            const paginationEl = document.getElementById('pagination');
            const totalPages = Math.ceil(pagination.total / pagination.limit);

            if (totalPages <= 1) {
                paginationEl.classList.add('hidden');
                return;
            }

            paginationEl.classList.remove('hidden');

            let html = '';

            // Previous button
            if (currentPage > 1) {
                html += `<button class="btn btn-secondary" onclick="goToPage(${currentPage - 1})">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                    ${t.prev}
                </button>`;
            }

            // Page indicator
            html += `<span class="btn btn-secondary" style="pointer-events: none;">
                ${t.page} ${currentPage} ${t.of} ${totalPages}
            </span>`;

            // Next button
            if (currentPage < totalPages) {
                html += `<button class="btn btn-secondary" onclick="goToPage(${currentPage + 1})">
                    ${t.next}
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>`;
            }

            paginationEl.innerHTML = html;
        }

        function goToPage(page) {
            const url = new URL(window.location.href);
            if (page > 1) {
                url.searchParams.set('page', page);
            } else {
                url.searchParams.delete('page');
            }
            window.location.href = url.href;
        }

        function viewDetail(id) {
            if (!id) {
                console.error('viewDetail called with empty id');
                return;
            }
            window.location.href = `/detail.html?q=${id}`;
        }

        function showError(message) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `
                <div class="status-icon">🔍</div>
                <p class="status-text">${message}</p>
            `;
            statusEl.style.display = 'block';
        }
    </script>
</body>
</html>
