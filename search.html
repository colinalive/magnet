<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0071e3">

    <!-- SEO Meta Tags (will be updated by JS) -->
    <title>Search Results - cili.xyz</title>
    <meta name="description" content="Search results on cili.xyz - Fast magnet link search engine">
    <meta name="keywords" content="magnet, torrent, search, download, cili">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="cili.xyz">
    <meta property="og:title" content="Search Results - cili.xyz">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-secondary">
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="/" class="nav-brand">⚡ cili.xyz</a>
            <div class="nav-search">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search..."
                    autocomplete="off"
                >
            </div>
            <div class="nav-actions" id="navActions">
                <!-- Language selector injected by JS -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <div class="main-content">
            <div class="container container-md">
                <!-- Search Header -->
                <div class="mb-6" id="searchHeader" style="display: none;">
                    <h1 class="text-center" style="font-size: 1.5rem; font-weight: 600; color: var(--color-text);">
                        <span id="resultsForText">Results for</span> "<span id="queryDisplay"></span>"
                    </h1>
                </div>

                <!-- Status -->
                <div id="status" class="status">
                    <div class="loading"></div>
                    <p class="status-text mt-4" id="statusText">Searching...</p>
                </div>

                <!-- Results List -->
                <div id="results"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!-- Footer content injected by JS -->
    </footer>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = window.App;
            const t = app.t;

            // Update page language
            document.documentElement.lang = app.lang;

            // Inject language selector
            document.getElementById('navActions').innerHTML = app.generateLangSelector();
            app.initLangSelector();

            // Inject footer
            document.getElementById('footer').outerHTML = app.generateFooter();

            // Update static translations
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('resultsForText').textContent = t.resultsFor;
            document.getElementById('statusText').textContent = t.searchingText;

            // Get search query from URL path: /search/{query}
            const pathParts = window.location.pathname.split('/');
            const query = pathParts[2] ? decodeURIComponent(pathParts[2]) : '';

            if (!query) {
                showError(t.noResults);
                return;
            }

            // Set query in search input and display
            document.getElementById('searchInput').value = query;
            document.getElementById('queryDisplay').textContent = query;

            // Update SEO
            app.updateSEO({
                title: `"${query}" - ${t.searchTitle} - ${t.siteName}`,
                description: t.searchMetaDescription.replace('{query}', query),
                canonical: `https://cili.xyz/search/${encodeURIComponent(query)}`
            });

            // Perform search
            performSearch(query);

            // Search input handler
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const newQuery = searchInput.value.trim();
                    if (newQuery && newQuery !== query) {
                        window.location.href = `/search/${encodeURIComponent(newQuery)}`;
                    }
                }
            });
        });

        async function performSearch(query) {
            const app = window.App;
            const t = app.t;
            const resultsContainer = document.getElementById('results');
            const statusEl = document.getElementById('status');
            const headerEl = document.getElementById('searchHeader');

            try {
                const data = await app.search(query);

                statusEl.style.display = 'none';

                if (!data || data.length === 0) {
                    showError(t.noResults);
                    return;
                }

                headerEl.style.display = 'block';
                resultsContainer.innerHTML = data.map(item => renderResultCard(item, app)).join('');

            } catch (error) {
                console.error('Search error:', error);
                showError(t.apiError);
            }
        }

        function renderResultCard(item, app) {
            const t = app.t;
            const name = app.escapeHtml(item.name || 'Unknown');
            const size = app.escapeHtml(item.size || 'Unknown');
            const seeders = item.seeders || 0;
            const leechers = item.leechers || 0;
            const date = app.escapeHtml(item.date || 'Unknown');
            const category = app.escapeHtml(item.category || 'Other');
            const hash = item.infohash || '';
            const verified = item.verified;

            // Cache the item data for detail page
            app.cacheDetail(hash, item);

            return `
                <div class="result-card" onclick="viewDetail('${hash}')">
                    <h3 class="result-title">${name}</h3>
                    <div class="result-meta">
                        <span class="result-tag">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            ${size}
                        </span>
                        <span class="result-tag seeds">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 19V5M5 12l7-7 7 7"/>
                            </svg>
                            ${seeders}
                        </span>
                        <span class="result-tag leechers">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12l7 7 7-7"/>
                            </svg>
                            ${leechers}
                        </span>
                        <span class="result-tag">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            ${date}
                        </span>
                        <span class="result-tag">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            ${category}
                        </span>
                        ${verified ? `<span class="result-tag verified">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                            ${t.verified}
                        </span>` : ''}
                    </div>
                </div>
            `;
        }

        function viewDetail(hash) {
            window.location.href = `/detail/${hash}`;
        }

        function showError(message) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `
                <div class="status-icon">🔍</div>
                <p class="status-text">${message}</p>
            `;
            statusEl.style.display = 'block';
        }
    </script>
</body>
</html>
