<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitSearch - Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-apple">
        <div class="container">
            <a class="navbar-brand navbar-brand-text ls-tight me-4" href="index.html">BitSearch</a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon" style="filter: grayscale(1);"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <div class="flex-grow-1 mx-lg-4 my-3 my-lg-0">
                    <div class="input-group-apple d-flex p-1">
                        <input type="text" id="searchInput" class="form-control input-apple shadow-none py-2 fs-6" data-i18n="search_placeholder" placeholder="Search...">
                        <button class="btn-search-apple py-1 px-3 fs-6" id="searchBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.098zm-5.442 1.398a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
                        </button>
                    </div>
                </div>
                
                <div class="dropdown ms-lg-3">
                    <button class="btn btn-lang-minimal dropdown-toggle" type="button" data-bs-toggle="dropdown" id="currentLangLabel">English</button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-4 mt-2">
                        <li><a class="dropdown-item lang-item py-2" href="#" data-lang="zh-CN">简体中文</a></li>
                        <li><a class="dropdown-item lang-item py-2" href="#" data-lang="en">English</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 880px;">
        
        <div class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom">
            <h2 class="h4 fw-bold mb-0 ls-tight">
                <span data-i18n="res_found">Results</span> 
                <span id="resultCount" class="text-secondary fw-normal ms-2 fs-5">...</span>
            </h2>
        </div>

        <div id="loading" class="text-center py-5 my-5">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        </div>

        <div id="resultsList" class="d-flex flex-column gap-4">
            </div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    
    <script>
        const API_BASE = 'https://api.cili.xyz'; 

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            const list = document.getElementById('resultsList');
            const loading = document.getElementById('loading');
            const countLabel = document.getElementById('resultCount');

            if(query) {
                document.getElementById('searchInput').value = query;
                try {
                    const res = await fetch(`${API_BASE}/?q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    loading.classList.add('d-none');
                    
                    if(data.error || data.length === 0) {
                        list.innerHTML = `<div class="text-center py-5 text-secondary">No results found.</div>`;
                        countLabel.innerText = "(0)";
                        return;
                    }
                    countLabel.innerText = `(${data.length})`;

                    // Render items using new minimal HTML structure
                    list.innerHTML = data.map(item => `
                        <div class="result-card">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1 me-4">
                                    <a href="detail.html?magnet=${encodeURIComponent(item.magnet)}&name=${encodeURIComponent(item.name)}&size=${item.size}" 
                                       class="result-title text-truncate-2">
                                        ${item.name}
                                    </a>
                                    <div class="mt-3 d-flex align-items-center flex-wrap">
                                        <span class="meta-badge">${item.category}</span>
                                        <span class="text-secondary small me-3">${item.size}</span>
                                        <span class="text-secondary small">${item.date}</span>
                                    </div>
                                </div>
                                <div class="text-end shrink-0">
                                    <div class="mb-3 text-secondary fw-500 small">
                                        <span class="text-success me-2">↑ ${item.seeders}</span>
                                        <span>↓ ${item.leechers}</span>
                                    </div>
                                    <a href="${item.magnet}" class="btn btn-pill btn-pill-primary btn-sm px-3">
                                        Download
                                    </a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } catch (e) { loading.innerHTML = `<div class="text-danger">Error.</div>`; }
            }
        });
    </script>
</body>
</html>
