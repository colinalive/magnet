<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>详情 - 磁力先锋</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 800px;">
        <button class="btn btn-outline-secondary mb-3" onclick="history.back()" id="btnBack">← Back</button>
        
        <div id="loading" class="text-center py-5 text-muted">Loading...</div>

        <div id="errorAlert" class="alert alert-danger text-center" style="display:none;"></div>

        <div class="card shadow-sm" id="detailCard" style="display:none">
            <div class="card-header bg-white py-3">
                 <h4 class="card-title text-break mb-0 text-primary" id="d-title"></h4>
            </div>
            <div class="card-body">
                <div class="row text-center mb-4">
                    <div class="col-3 border-end">
                        <div class="text-muted small" id="l-seeders">Seeders</div>
                        <div class="fs-4 fw-bold text-success" id="d-seeders">-</div>
                    </div>
                    <div class="col-3 border-end">
                        <div class="text-muted small" id="l-leechers">Leechers</div>
                        <div class="fs-4 fw-bold text-danger" id="d-leechers">-</div>
                    </div>
                    <div class="col-3 border-end">
                        <div class="text-muted small" id="l-size">Size</div>
                        <div class="fs-5 fw-bold" id="d-size">-</div>
                    </div>
                    <div class="col-3">
                        <div class="text-muted small" id="l-downloads">Downloads</div>
                        <div class="fs-5 fw-bold" id="d-downloads">-</div>
                    </div>
                </div>

                <div class="d-grid gap-2 mb-4">
                    <a href="#" id="magnetLink" class="btn btn-success btn-lg shadow-sm">
                        🧲 <span id="btn-text">Magnet Download</span>
                    </a>
                </div>

                <table class="table table-bordered table-sm small">
                    <tbody>
                        <tr>
                            <th class="bg-light w-25 ps-3 align-middle" id="l-date">Date</th>
                            <td class="p-2" id="d-date">-</td>
                        </tr>
                        <tr>
                            <th class="bg-light ps-3 align-middle" id="l-hash">Info Hash</th>
                            <td class="font-monospace text-break p-2" id="d-hash">-</td>
                        </tr>
                        <tr>
                            <th class="bg-light ps-3 align-middle">Magnet Raw</th>
                            <td class="p-2">
                                <div class="font-monospace text-break text-muted bg-light p-2 rounded border" style="cursor:pointer" onclick="copyMagnet()" id="rawMagnet"></div>
                                <div id="copyToast" class="text-success small mt-1 fw-bold" style="opacity:0; transition: opacity 0.5s">Copied!</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const t = window.initPage();
            
            // 初始化界面文字
            document.getElementById('btnBack').textContent = `← ${t.back}`;
            document.getElementById('loading').textContent = t.loading;
            document.getElementById('l-seeders').textContent = t.seeders;
            document.getElementById('l-leechers').textContent = t.leechers;
            document.getElementById('l-size').textContent = t.size;
            document.getElementById('l-downloads').textContent = t.downloads;
            document.getElementById('l-date').textContent = t.date;
            document.getElementById('l-hash').textContent = t.infohash;
            document.getElementById('btn-text').textContent = t.magnet_open;

            const hash = new URLSearchParams(window.location.search).get('hash');
            if(!hash) {
                document.getElementById('loading').textContent = "Error: Invalid Link (No Hash)";
                return;
            }

            try {
                // 🔥 关键修改：直接传 Hash，不使用 encodeURIComponent，也不 Base64
                // 因为 infohash 本身是安全的字符串，且 API 可能对精确匹配有要求
                const res = await fetch(`${API_BASE}/?q=${hash}`);
                const data = await res.json();

                if(!data || data.length === 0 || data.error) {
                    throw new Error(t.empty);
                }

                const item = data[0];

                document.getElementById('loading').style.display = 'none';
                document.getElementById('detailCard').style.display = 'block';

                document.title = `${item.name} - ${t.title}`;
                document.getElementById('d-title').textContent = item.name;
                document.getElementById('d-seeders').textContent = item.seeders;
                document.getElementById('d-leechers').textContent = item.leechers;
                document.getElementById('d-size').textContent = item.size;
                document.getElementById('d-downloads').textContent = item.downloads || 0;
                document.getElementById('d-date').textContent = item.date;
                document.getElementById('d-hash').textContent = item.infohash;
                
                document.getElementById('magnetLink').href = item.magnet;
                document.getElementById('rawMagnet').textContent = item.magnet;

            } catch(e) {
                document.getElementById('loading').style.display = 'none';
                const errAlert = document.getElementById('errorAlert');
                errAlert.style.display = 'block';
                errAlert.textContent = `${t.error}: ${e.message}`;
            }
        });

        function copyMagnet() {
            const text = document.getElementById('rawMagnet').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('copyToast');
                toast.style.opacity = 1;
                toast.textContent = window.initPage().copy_success; 
                setTimeout(() => toast.style.opacity = 0, 2000);
            });
        }
    </script>
</body>
</html>
