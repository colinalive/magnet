<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0071e3">

    <!-- SEO Meta Tags (will be updated by JS) -->
    <title>Magnet Details - cili.xyz</title>
    <meta name="description" content="Magnet link details on cili.xyz">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="cili.xyz">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="/" class="nav-brand">⚡ cili.xyz</a>
            <div class="nav-actions">
                <button class="btn btn-secondary" onclick="history.back()" id="backBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    <span>Back</span>
                </button>
                <div id="langSelector">
                    <!-- Language selector injected by JS -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <div class="main-content">
            <div class="container container-md">
                <!-- Loading State -->
                <div id="status" class="status">
                    <div class="loading"></div>
                    <p class="status-text mt-4" id="statusText">Loading...</p>
                </div>

                <!-- Content (hidden until data loads) -->
                <div id="content" class="hidden">
                    <!-- Title -->
                    <h1 id="title" style="font-size: 1.75rem; font-weight: 700; color: var(--color-text); margin-bottom: 24px; line-height: 1.4;"></h1>

                    <!-- Badges Row -->
                    <div id="badgesRow" class="mb-6" style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <!-- Verified Badge -->
                        <span id="verifiedBadge" class="result-tag verified hidden" style="font-size: 0.875rem; padding: 8px 16px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                            <span id="verifiedText">Verified</span>
                        </span>
                        <!-- Category Badge -->
                        <span id="categoryBadge" class="result-tag hidden" style="font-size: 0.875rem; padding: 8px 16px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            <span id="categoryText"></span>
                        </span>
                        <!-- IMDb Badge -->
                        <span id="imdbBadge" class="result-tag hidden" style="font-size: 0.875rem; padding: 8px 16px; background: rgba(245, 197, 24, 0.15); color: #f5c518;">
                            <span style="font-weight: 700;">IMDb</span>
                            <span id="imdbRating"></span>
                        </span>
                    </div>

                    <!-- Stats Grid -->
                    <div class="grid-stats mb-8">
                        <div class="stat-card">
                            <p class="stat-label" id="labelSize">Size</p>
                            <p class="stat-value" id="statSize">-</p>
                        </div>
                        <div class="stat-card">
                            <p class="stat-label" id="labelSeeds">Seeds</p>
                            <p class="stat-value success" id="statSeeds">-</p>
                        </div>
                        <div class="stat-card">
                            <p class="stat-label" id="labelLeechers">Leechers</p>
                            <p class="stat-value error" id="statLeechers">-</p>
                        </div>
                        <div class="stat-card">
                            <p class="stat-label" id="labelDownloads">Downloads</p>
                            <p class="stat-value" id="statDownloads">-</p>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;">
                        <!-- Copy Magnet Button -->
                        <button class="btn btn-dark btn-lg" id="copyBtn" onclick="copyMagnet()" style="flex: 1; min-width: 200px;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            <span id="copyBtnText">Copy Magnet Link</span>
                        </button>

                        <!-- Download Torrent Button (if available) -->
                        <a id="torrentBtn" href="#" class="btn btn-secondary btn-lg hidden" style="flex: 1; min-width: 200px; text-decoration: none;" target="_blank" rel="noopener">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            <span id="torrentBtnText">Download .torrent</span>
                        </a>
                    </div>

                    <!-- Magnet Link Display -->
                    <div class="magnet-display mb-8" id="magnetDisplay"></div>

                    <!-- Technical Details Section -->
                    <div class="detail-section">
                        <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 20px;" id="techDetailsTitle">Technical Details</h2>
                        <div id="detailRows">
                            <!-- Dynamic rows will be inserted here -->
                        </div>
                    </div>

                    <!-- File List Section (if available) -->
                    <div class="detail-section hidden" id="fileListSection">
                        <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 20px;">
                            <span id="fileListTitle">File List</span>
                            <span id="fileCount" style="font-weight: 400; color: var(--color-text-tertiary); font-size: 1rem;"></span>
                        </h2>
                        <div class="file-list" id="fileList"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!-- Footer content injected by JS -->
    </footer>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script>
        let currentMagnet = '';

        document.addEventListener('DOMContentLoaded', async () => {
            const app = window.App;
            const t = app.t;

            // Update page language
            document.documentElement.lang = app.lang;

            // Inject language selector
            document.getElementById('langSelector').innerHTML = app.generateLangSelector();
            app.initLangSelector();

            // Inject footer
            document.getElementById('footer').outerHTML = app.generateFooter();

            // Update static translations
            document.getElementById('backBtn').querySelector('span').textContent = t.back;
            document.getElementById('statusText').textContent = t.loading;
            document.getElementById('labelSize').textContent = t.size;
            document.getElementById('labelSeeds').textContent = t.seeds;
            document.getElementById('labelLeechers').textContent = t.leechers;
            document.getElementById('labelDownloads').textContent = t.downloads;
            document.getElementById('copyBtnText').textContent = t.copyMagnet;
            document.getElementById('torrentBtnText').textContent = t.downloadTorrent;
            document.getElementById('techDetailsTitle').textContent = t.technicalDetails;
            document.getElementById('fileListTitle').textContent = t.fileList;
            document.getElementById('verifiedText').textContent = t.verified;

            // Get ID from URL path: /detail/{id}
            const pathParts = window.location.pathname.split('/');
            const id = pathParts[2] || '';

            if (!id) {
                showError(t.resourceNotFound);
                return;
            }

            // Try to get cached data first
            let data = app.getCachedDetail(id);

            if (data) {
                renderDetail(data);
                return;
            }

            // No cache - try to fetch from API
            try {
                data = await app.getDetail(id);
                if (data && !data.error) {
                    // Cache for future use
                    app.cacheDetail(id, data);
                    renderDetail(data);
                } else {
                    showError(t.resourceNotFound);
                }
            } catch (error) {
                console.error('Failed to fetch detail:', error);
                showError(t.loadingError);
            }
        });

        function renderDetail(item) {
            const app = window.App;
            const t = app.t;

            // Hide loading, show content
            document.getElementById('status').style.display = 'none';
            document.getElementById('content').classList.remove('hidden');

            // Title
            const title = item.name || 'Unknown';
            document.getElementById('title').textContent = title;

            // Update SEO
            app.updateSEO({
                title: `${title} - ${t.siteName}`,
                description: `Download ${title} - ${item.size || 'Unknown size'}`,
                canonical: `https://cili.xyz/detail/${item.id || item.infohash}`
            });

            // Verified badge
            if (item.verified) {
                document.getElementById('verifiedBadge').classList.remove('hidden');
            }

            // Category badge
            if (item.category) {
                const categoryBadge = document.getElementById('categoryBadge');
                const categoryText = item.subcategory
                    ? `${item.category} / ${item.subcategory}`
                    : item.category;
                document.getElementById('categoryText').textContent = categoryText;
                categoryBadge.classList.remove('hidden');
            }

            // IMDb badge
            if (item.imdb && item.imdb.rating) {
                document.getElementById('imdbRating').textContent = item.imdb.rating;
                document.getElementById('imdbBadge').classList.remove('hidden');
            }

            // Stats
            document.getElementById('statSize').textContent = item.size || '-';
            document.getElementById('statSeeds').textContent = item.seeders ?? '-';
            document.getElementById('statLeechers').textContent = item.leechers ?? '-';
            document.getElementById('statDownloads').textContent = item.downloads ?? '-';

            // Magnet link
            currentMagnet = item.magnet || item.magnetUrl || `magnet:?xt=urn:btih:${item.infohash}`;
            document.getElementById('magnetDisplay').textContent = currentMagnet;

            // Torrent download button
            if (item.torrentUrl) {
                const torrentBtn = document.getElementById('torrentBtn');
                torrentBtn.href = item.torrentUrl;
                torrentBtn.classList.remove('hidden');
            }

            // Technical details
            const detailRows = document.getElementById('detailRows');
            const details = [];

            // Add all available fields
            if (item.infohash) {
                details.push({ label: t.infoHash, value: item.infohash, mono: true });
            }
            if (item.category) {
                details.push({ label: t.category, value: item.category });
            }
            if (item.subcategory) {
                details.push({ label: t.subcategory, value: item.subcategory });
            }
            if (item.date || item.uploadedAt) {
                details.push({ label: t.uploadedAt, value: app.formatDate(item.date || item.uploadedAt) });
            }
            if (item.id) {
                details.push({ label: 'ID', value: item.id, mono: true });
            }
            if (item.size_bytes) {
                details.push({ label: `${t.size} (bytes)`, value: item.size_bytes.toLocaleString() });
            }
            if (item.imdb && item.imdb.id) {
                details.push({
                    label: 'IMDb',
                    value: item.imdb.id,
                    link: `https://www.imdb.com/title/${item.imdb.id}/`
                });
            }

            detailRows.innerHTML = details.map(d => `
                <div class="detail-row">
                    <span class="detail-label">${app.escapeHtml(d.label)}</span>
                    ${d.link
                        ? `<a href="${d.link}" target="_blank" rel="noopener" class="detail-value ${d.mono ? 'mono' : ''}" style="color: var(--color-primary);">${app.escapeHtml(d.value)}</a>`
                        : `<span class="detail-value ${d.mono ? 'mono' : ''}">${app.escapeHtml(String(d.value))}</span>`
                    }
                </div>
            `).join('');

            // File list (if available)
            if (item.files && Array.isArray(item.files) && item.files.length > 0) {
                const fileListSection = document.getElementById('fileListSection');
                const fileList = document.getElementById('fileList');
                const fileCount = document.getElementById('fileCount');

                fileListSection.classList.remove('hidden');
                fileCount.textContent = ` (${item.files.length} ${t.files})`;

                // Sort files by size (largest first) or by path
                const sortedFiles = [...item.files].sort((a, b) => {
                    const sizeA = a.size_bytes || a.sizeBytes || 0;
                    const sizeB = b.size_bytes || b.sizeBytes || 0;
                    return sizeB - sizeA;
                });

                // Limit to first 100 files for performance
                const displayFiles = sortedFiles.slice(0, 100);

                fileList.innerHTML = displayFiles.map(file => {
                    const fileName = file.name || file.path || 'Unknown';
                    const fileSize = file.size || app.formatSize(file.size_bytes || file.sizeBytes);
                    return `
                        <div class="file-item">
                            <span class="file-name">${app.escapeHtml(fileName)}</span>
                            <span class="file-size">${fileSize || '-'}</span>
                        </div>
                    `;
                }).join('');

                // Show "more files" note if truncated
                if (sortedFiles.length > 100) {
                    fileList.innerHTML += `
                        <div class="file-item" style="color: var(--color-text-tertiary); font-style: italic;">
                            ... and ${sortedFiles.length - 100} more files
                        </div>
                    `;
                }
            }
        }

        function copyMagnet() {
            if (currentMagnet) {
                window.App.copyToClipboard(currentMagnet);
            }
        }

        function showError(message) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `
                <div class="status-icon">⚠️</div>
                <p class="status-text">${message}</p>
                <button class="btn btn-secondary mt-6" onclick="history.back()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    <span>${window.App.t.back}</span>
                </button>
            `;
            statusEl.style.display = 'block';
        }
    </script>
</body>
</html>
