<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0071e3">

    <!-- SEO Meta Tags (will be updated by JS) -->
    <title>Magnet Details - cili.xyz</title>
    <meta name="description" content="Magnet link details on cili.xyz">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="cili.xyz">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="/" class="nav-brand">⚡ cili.xyz</a>
            <div class="nav-actions">
                <button class="btn btn-secondary" onclick="history.back()" id="backBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    <span>Back</span>
                </button>
                <div id="langSelector">
                    <!-- Language selector injected by JS -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <div class="main-content">
            <div class="container container-md">
                <!-- Loading State -->
                <div id="status" class="status">
                    <div class="loading"></div>
                    <p class="status-text mt-4" id="statusText">Loading...</p>
                </div>

                <!-- Content (hidden until data loads) -->
                <div id="content" class="hidden">
                    <!-- Title -->
                    <h1 id="title" style="font-size: 1.75rem; font-weight: 700; color: var(--color-text); margin-bottom: 24px; line-height: 1.4;"></h1>

                    <!-- Verified Badge (if applicable) -->
                    <div id="verifiedBadge" class="hidden mb-6">
                        <span class="result-tag verified" style="font-size: 0.875rem; padding: 8px 16px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                <polyline points="22 4 12 14.01 9 11.01"/>
                            </svg>
                            <span id="verifiedText">Verified</span>
                        </span>
                    </div>

                    <!-- Stats Grid -->
                    <div class="grid-stats mb-8">
                        <div class="stat-card">
                            <p class="stat-label" id="labelSize">Size</p>
                            <p class="stat-value" id="statSize">-</p>
                        </div>
                        <div class="stat-card">
                            <p class="stat-label" id="labelSeeds">Seeds</p>
                            <p class="stat-value success" id="statSeeds">-</p>
                        </div>
                        <div class="stat-card">
                            <p class="stat-label" id="labelLeechers">Leechers</p>
                            <p class="stat-value error" id="statLeechers">-</p>
                        </div>
                        <div class="stat-card">
                            <p class="stat-label" id="labelDownloads">Downloads</p>
                            <p class="stat-value" id="statDownloads">-</p>
                        </div>
                    </div>

                    <!-- Copy Magnet Button -->
                    <button class="btn btn-dark btn-lg btn-block mb-4" id="copyBtn" onclick="copyMagnet()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        <span id="copyBtnText">Copy Magnet Link</span>
                    </button>

                    <!-- Magnet Link Display -->
                    <div class="magnet-display mb-8" id="magnetDisplay"></div>

                    <!-- Technical Details Section -->
                    <div class="detail-section">
                        <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 20px;" id="techDetailsTitle">Technical Details</h2>

                        <div id="detailRows">
                            <!-- Dynamic rows will be inserted here -->
                        </div>
                    </div>

                    <!-- File List Section (if available) -->
                    <div class="detail-section hidden" id="fileListSection">
                        <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 20px;">
                            <span id="fileListTitle">File List</span>
                            <span id="fileCount" style="font-weight: 400; color: var(--color-text-tertiary); font-size: 1rem;"></span>
                        </h2>
                        <div class="file-list" id="fileList"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer">
        <!-- Footer content injected by JS -->
    </footer>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script>
        let currentMagnet = '';

        document.addEventListener('DOMContentLoaded', () => {
            const app = window.App;
            const t = app.t;

            // Update page language
            document.documentElement.lang = app.lang;

            // Inject language selector
            document.getElementById('langSelector').innerHTML = app.generateLangSelector();
            app.initLangSelector();

            // Inject footer
            document.getElementById('footer').outerHTML = app.generateFooter();

            // Update static translations
            document.getElementById('backBtn').querySelector('span').textContent = t.back;
            document.getElementById('statusText').textContent = t.searchingText;
            document.getElementById('labelSize').textContent = t.size;
            document.getElementById('labelSeeds').textContent = t.seeds;
            document.getElementById('labelLeechers').textContent = t.leechers;
            document.getElementById('labelDownloads').textContent = t.downloads;
            document.getElementById('copyBtnText').textContent = t.copyMagnet;
            document.getElementById('techDetailsTitle').textContent = t.technicalDetails;
            document.getElementById('fileListTitle').textContent = t.fileList;
            document.getElementById('verifiedText').textContent = t.verified;

            // Get hash from URL path: /detail/{hash}
            const pathParts = window.location.pathname.split('/');
            const hash = pathParts[2] || '';

            if (!hash) {
                showError(t.resourceNotFound);
                return;
            }

            // Try to get cached data first
            const cachedData = app.getCachedDetail(hash);

            if (cachedData) {
                renderDetail(cachedData);
            } else {
                // No cache - show error since API doesn't support hash queries
                showError(t.resourceNotFound);
            }
        });

        function renderDetail(item) {
            const app = window.App;
            const t = app.t;

            // Hide loading, show content
            document.getElementById('status').style.display = 'none';
            document.getElementById('content').classList.remove('hidden');

            // Title
            const title = item.name || 'Unknown';
            document.getElementById('title').textContent = title;

            // Update SEO
            app.updateSEO({
                title: `${title} - ${t.siteName}`,
                description: `Download ${title} - ${item.size || 'Unknown size'}`,
                canonical: `https://cili.xyz/detail/${item.infohash}`
            });

            // Verified badge
            if (item.verified) {
                document.getElementById('verifiedBadge').classList.remove('hidden');
            }

            // Stats
            document.getElementById('statSize').textContent = item.size || '-';
            document.getElementById('statSeeds').textContent = item.seeders ?? '-';
            document.getElementById('statLeechers').textContent = item.leechers ?? '-';
            document.getElementById('statDownloads').textContent = item.downloads ?? '-';

            // Magnet link
            currentMagnet = item.magnet || `magnet:?xt=urn:btih:${item.infohash}`;
            document.getElementById('magnetDisplay').textContent = currentMagnet;

            // Technical details
            const detailRows = document.getElementById('detailRows');
            const details = [];

            // Add all available fields
            if (item.infohash) {
                details.push({ label: t.infoHash, value: item.infohash, mono: true });
            }
            if (item.category) {
                details.push({ label: t.category, value: item.category });
            }
            if (item.date) {
                details.push({ label: t.dateAdded, value: item.date });
            }
            if (item.id) {
                details.push({ label: 'ID', value: item.id, mono: true });
            }
            if (item.size_bytes) {
                details.push({ label: `${t.size} (bytes)`, value: item.size_bytes.toLocaleString() });
            }

            detailRows.innerHTML = details.map(d => `
                <div class="detail-row">
                    <span class="detail-label">${app.escapeHtml(d.label)}</span>
                    <span class="detail-value ${d.mono ? 'mono' : ''}">${app.escapeHtml(d.value)}</span>
                </div>
            `).join('');

            // File list (if available)
            if (item.files && Array.isArray(item.files) && item.files.length > 0) {
                const fileListSection = document.getElementById('fileListSection');
                const fileList = document.getElementById('fileList');
                const fileCount = document.getElementById('fileCount');

                fileListSection.classList.remove('hidden');
                fileCount.textContent = `(${item.files.length} ${t.files})`;

                fileList.innerHTML = item.files.map(file => `
                    <div class="file-item">
                        <span class="file-name">${app.escapeHtml(file.name || file.path || 'Unknown')}</span>
                        <span class="file-size">${file.size || app.formatSize(file.size_bytes) || '-'}</span>
                    </div>
                `).join('');
            }
        }

        function copyMagnet() {
            if (currentMagnet) {
                window.App.copyToClipboard(currentMagnet);
            }
        }

        function showError(message) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `
                <div class="status-icon">⚠️</div>
                <p class="status-text">${message}</p>
                <button class="btn btn-secondary mt-6" onclick="history.back()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    <span>${window.App.t.back}</span>
                </button>
            `;
            statusEl.style.display = 'block';
        }
    </script>
</body>
</html>
