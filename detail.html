<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁力详情 - cili.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col pt-24 px-6">

<nav class="fixed w-full z-50 top-0 bg-white/80 backdrop-blur-xl border-b p-4 flex justify-between max-w-screen-xl mx-auto left-0 right-0">
    <a href="index.html" class="font-bold">⚡ cili.xyz</a>
    <button onclick="history.back()" class="bg-gray-100 px-5 py-2 rounded-full text-sm font-bold">← Back</button>
</nav>

<main class="max-w-4xl mx-auto w-full flex-grow">
    <div id="loader" class="text-center py-20 text-gray-400">Loading Metadata...</div>
    <div id="content" class="hidden">
        <h1 id="title" class="text-3xl font-extrabold mb-8 text-black"></h1>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
            <div class="bg-gray-50 p-6 rounded-3xl"><p class="text-xs text-gray-400 font-bold mb-1">SIZE</p><p id="size" class="text-xl font-bold"></p></div>
            <div class="bg-gray-50 p-6 rounded-3xl"><p class="text-xs text-gray-400 font-bold mb-1">SEEDS</p><p id="seeds" class="text-xl font-bold text-green-600"></p></div>
            <div class="bg-gray-50 p-6 rounded-3xl"><p class="text-xs text-gray-400 font-bold mb-1">LEECHERS</p><p id="leech" class="text-xl font-bold text-red-500"></p></div>
            <div class="bg-gray-50 p-6 rounded-3xl"><p class="text-xs text-gray-400 font-bold mb-1">DOWNLOADS</p><p id="dl" class="text-xl font-bold"></p></div>
        </div>

        <button onclick="copyM()" class="w-full bg-black text-white py-5 rounded-2xl font-bold text-lg mb-4 hover:scale-[1.01] transition-transform">Copy Magnet Link</button>
        <div id="mag" class="p-4 bg-gray-100 rounded-xl text-[10px] font-mono break-all text-gray-400 mb-10"></div>

        <div class="border-t pt-8 mb-20">
            <h2 class="text-xl font-bold mb-6">Technical Details</h2>
            <div class="space-y-4 text-sm">
                <div class="flex justify-between border-b pb-2"><span>Info Hash</span><span id="hash" class="font-mono text-[10px]"></span></div>
                <div class="flex justify-between border-b pb-2"><span>Category</span><span id="cat" class="font-bold"></span></div>
                <div class="flex justify-between border-b pb-2"><span>Date Added</span><span id="date" class="font-bold"></span></div>
            </div>
        </div>
    </div>
</main>

<footer class="py-10 border-t text-center text-sm text-gray-400">© 2026 cili.xyz</footer>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const hash = new URLSearchParams(window.location.search).get('hash');
        if(!hash) return;
        
        // 方案：优先读缓存（解决 404），失败则请求 API
        const cached = sessionStorage.getItem('cili_res_' + hash);
        if(cached) {
            render(JSON.parse(decodeURIComponent(atob(cached))));
        } else {
            try {
                const res = await fetch(`https://api.cili.xyz/?q=${hash}`);
                const data = await res.json();
                if(data.length) render(data[0]);
                else document.getElementById('loader').textContent = "Error: Resource not found";
            } catch(e) { document.getElementById('loader').textContent = "API Error"; }
        }
    });

    function render(item) {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('content').classList.remove('hidden');
        document.getElementById('title').textContent = item.name;
        document.getElementById('size').textContent = item.size;
        document.getElementById('seeds').textContent = item.seeders;
        document.getElementById('leech').textContent = item.leechers;
        document.getElementById('dl').textContent = item.downloads || 0;
        document.getElementById('mag').textContent = item.magnet;
        document.getElementById('hash').textContent = item.infohash;
        document.getElementById('date').textContent = item.date;
        document.getElementById('cat').textContent = item.category || 'Other';
        document.title = item.name + " - cili.xyz";
    }

    function copyM() {
        navigator.clipboard.writeText(document.getElementById('mag').textContent);
        alert("Magnet Link Copied!");
    }
</script>
</body>
</html>
