<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.6.6/css/flag-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary brand-text" href="index.html">Magnet Pioneer</a>
            <div class="d-flex align-items-center overflow-auto" id="flagContainer"></div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-header bg-white text-center py-5 border-bottom">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 80px; height: 80px;">
                            <i class="fa-solid fa-file-lines fa-3x"></i>
                        </div>
                        <h1 class="h3 fw-bold px-3 text-break" id="fileName" data-i18n="loading">...</h1>
                        <div class="mt-3">
                            <span class="badge bg-light text-secondary border font-monospace" id="infoHash">...</span>
                        </div>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <div id="detailContainer"></div>
                        
                        <div id="loading" class="text-center py-3">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="text-muted mt-2">Loading Details...</p>
                        </div>
                    </div>

                    <div class="card-footer bg-light p-3 text-center text-muted small">
                        DMCA: No files hosted. Metadata only.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
