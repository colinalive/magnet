<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail - cili.xyz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.6.6/css/flag-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar-clean">
        <div class="nav-container">
            <a href="/" class="brand-logo">cili<span>.xyz</span></a>
            <div class="lang-flags" id="flagContainer"></div>
        </div>
    </nav>

    <div class="detail-header">
        <div class="nav-container" style="display: block;">
            <div class="file-icon-large">
                <i class="fa-regular fa-file"></i>
            </div>
            <h1 id="fileName" style="word-break: break-all; margin-bottom: 20px;">Loading...</h1>
            
            <div style="display: flex; gap: 20px; justify-content: center; color: var(--text-muted); margin-bottom: 30px;">
                <span><i class="fa-solid fa-database"></i> <span id="fileSize">--</span></span>
                <span><i class="fa-solid fa-shield-halved"></i> Verified</span>
            </div>

            <a href="#" id="magnetBtn" class="btn-action">
                <i class="fa-solid fa-magnet"></i> <span data-i18n="btn_download">Download Magnet</span>
            </a>
        </div>
    </div>

    <div class="nav-container" style="padding-top: 40px; padding-bottom: 60px;">
        <div style="background: white; border-radius: 16px; padding: 30px; box-shadow: var(--shadow-card);">
            <h3 style="border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px;">Info Hash</h3>
            <div id="infoHash" style="font-family: monospace; background: #f8fafc; padding: 15px; border-radius: 8px; word-break: break-all; color: #334155;">
                --
            </div>

            <h3 style="border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; margin-top: 40px;" data-i18n="label_files">Files</h3>
            <div style="color: var(--text-muted); font-style: italic;">
                File list requires active metadata fetch...
            </div>
        </div>
    </div>

    <script src="/main.js"></script>
</body>
</html>
