<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁力详情 - cili.xyz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #fff; }
        .data-grid { background: #f5f5f7; border-radius: 28px; padding: 2.5rem; }
        .btn-copy { background: #1d1d1f; color: white; border-radius: 14px; transition: all 0.2s; }
        .btn-copy:hover { background: #000; transform: scale(1.02); }
        .label-text { color: #86868b; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<nav class="fixed w-full z-50 bg-white/80 backdrop-blur-xl border-b border-gray-100">
    <div class="max-w-4xl mx-auto p-4 flex justify-between items-center">
        <a href="index.html" class="font-bold text-lg">⚡ cili.xyz</a>
        <button onclick="history.back()" class="bg-gray-100 px-5 py-2 rounded-full text-sm font-bold">← Back</button>
    </div>
</nav>

<main class="mt-32 max-w-4xl mx-auto px-6 w-full flex-grow">
    <div id="content" class="hidden">
        <h1 id="title" class="text-3xl md:text-4xl font-extrabold text-black mb-10 leading-tight"></h1>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12">
            <div class="data-grid"><p class="label-text">Size</p><p id="size" class="text-2xl font-bold mt-2"></p></div>
            <div class="data-grid"><p class="label-text">Seeds</p><p id="seeds" class="text-2xl font-bold mt-2 text-green-600"></p></div>
            <div class="data-grid"><p class="label-text">Peers</p><p id="leech" class="text-2xl font-bold mt-2 text-red-500"></p></div>
            <div class="data-grid"><p class="label-text">Downloads</p><p id="downloads" class="text-2xl font-bold mt-2"></p></div>
        </div>

        <div class="mb-14">
            <button onclick="copyLink()" class="btn-copy w-full py-6 text-xl font-bold shadow-2xl flex items-center justify-center space-x-3">
                <span>🧲</span><span id="copyBtnTxt">Copy Magnet</span>
            </button>
            <div id="magnetRaw" class="mt-6 p-5 bg-gray-50 rounded-2xl text-xs font-mono text-gray-400 break-all select-all border border-dashed"></div>
        </div>

        <div class="border-t border-gray-100 pt-12 mb-20">
            <h2 class="text-2xl font-bold mb-8">Metadata Details</h2>
            <div class="grid gap-6">
                <div class="flex justify-between py-4 border-b border-gray-50"><span class="label-text">Info Hash</span><span id="hash" class="font-mono text-xs"></span></div>
                <div class="flex justify-between py-4 border-b border-gray-50"><span class="label-text">Category</span><span id="category" class="font-bold"></span></div>
                <div class="flex justify-between py-4 border-b border-gray-50"><span class="label-text">Date</span><span id="date" class="font-bold"></span></div>
                <div class="flex justify-between py-4 border-b border-gray-50"><span class="label-text">Verified</span><span id="verified" class="font-bold"></span></div>
            </div>
        </div>
    </div>
    
    <div id="loading" class="text-center py-20 text-gray-400">Requesting BitSearch API...</div>
</main>

<footer class="py-12 border-t border-gray-100 bg-gray-50">
    <div class="max-w-4xl mx-auto px-6 text-center">
        <p class="text-sm text-gray-400">© 2026 磁力先锋 (cili.xyz). Professional Indexing Service.</p>
    </div>
</footer>

<script src="js/app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const hash = new URLSearchParams(window.location.search).get('hash');
        if(!hash) return (location.href = 'index.html');

        // 详情页 100% 成功方案：优先读取 Session 缓存
        const cached = sessionStorage.getItem('cili_info_' + hash);

        if(cached) {
            render(JSON.parse(decodeURIComponent(atob(cached))));
        } else {
            // 回退方案：通过接口直接根据 Hash 查询
            try {
                const res = await fetch(`${CONFIG.API_BASE}/?q=${hash}`);
                const data = await res.json();
                if(data && data.length) render(data[0]);
                else throw new Error("NotFound");
            } catch(e) {
                document.getElementById('loading').innerHTML = `<p class="text-red-500">Resource not found in index.</p>`;
            }
        }
    });

    function render(item) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        
        document.getElementById('title').textContent = item.name;
        document.getElementById('size').textContent = item.size;
        document.getElementById('seeds').textContent = item.seeders;
        document.getElementById('leech').textContent = item.leechers;
        document.getElementById('downloads').textContent = item.downloads || 0;
        document.getElementById('magnetRaw').textContent = item.magnet;
        document.getElementById('hash').textContent = item.infohash;
        document.getElementById('date').textContent = item.date;
        document.getElementById('category').textContent = item.category || 'Other';
        document.getElementById('verified').textContent = item.verified ? "✅ Verified" : "Unverified";
        document.getElementById('copyBtnTxt').textContent = App.t.copy;
        
        App.updateMeta(item.name); //
    }

    function copyLink() {
        const link = document.getElementById('magnetRaw').textContent;
        navigator.clipboard.writeText(link);
        alert(App.t.success);
    }
</script>
</body>
</html>
