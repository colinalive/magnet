<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... | ePark Details</title>
    <meta name="description" content="Torrent details page">
    <meta name="robots" content="noindex"> <style>
        :root { --primary: #0070f3; --bg: #f8f9fa; --card: #fff; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; line-height: 1.6; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }

        /* Card Style */
        .detail-card { background: var(--card); border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        
        h1 { margin: 0 0 20px 0; font-size: 22px; word-break: break-all; color: #111; }
        
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .meta-box { background: #f9f9f9; padding: 10px; border-radius: 8px; text-align: center; }
        .meta-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .meta-value { font-size: 16px; font-weight: 700; color: #333; margin-top: 5px; }
        .val-seed { color: #10b981; }
        .val-leech { color: #ef4444; }

        /* Actions */
        .actions { display: flex; flex-direction: column; gap: 15px; }
        .magnet-box { background: #f0f7ff; border: 1px solid #cce5ff; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; color: #0056b3; word-break: break-all; cursor: pointer; position: relative; }
        .magnet-box:hover { background: #e6f2ff; }
        
        .btn { display: block; width: 100%; padding: 16px; text-align: center; border-radius: 10px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; font-size: 16px; transition: opacity 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-copy { background: #333; color: white; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }

        .file-list { margin-top: 40px; }
        .file-item { padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; display: flex; justify-content: space-between; }
        
        .loading { text-align: center; padding: 50px; color: #666; font-size: 18px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none; }
        
        /* Toast Notification */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <a href="javascript:history.back()" class="back-link">← Back to Search</a>
    
    <div id="loading" class="loading">
        Loading details from network...<br>
        <small style="font-size:12px; color:#999">Querying by Hash...</small>
    </div>

    <div id="content" class="detail-card" style="display: none;">
        <h1 id="title">Loading...</h1>
        
        <div class="meta-grid">
            <div class="meta-box"><div class="meta-label">Size</div><div class="meta-value" id="size">-</div></div>
            <div class="meta-box"><div class="meta-label">Date</div><div class="meta-value" id="date">-</div></div>
            <div class="meta-box"><div class="meta-label">Seeders</div><div class="meta-value val-seed" id="seeders">-</div></div>
            <div class="meta-box"><div class="meta-label">Leechers</div><div class="meta-value val-leech" id="leechers">-</div></div>
            <div class="meta-box"><div class="meta-label">Downloads</div><div class="meta-value" id="downloads">-</div></div>
        </div>

        <div class="actions">
            <a id="magnetBtn" href="#" class="btn btn-primary">🧲 Open Magnet Link</a>
            <div class="magnet-box" onclick="copyMagnet()" id="magnetRaw" title="Click to Copy">
                magnet:?xt=urn:btih:...
            </div>
        </div>

        <div class="file-list">
            <h3>Info Hash</h3>
            <div class="file-item" id="infoHash">-</div>
            <p style="color:#999; font-size:12px; margin-top:10px;">
                * Detailed file lists are retrieved via magnet metadata once download starts.
            </p>
        </div>
    </div>
</div>

<div id="toast">Copied to clipboard!</div>

<script>
    const API_BASE = 'https://api.cili.xyz'; 
    const hash = new URLSearchParams(window.location.search).get('hash');

    // Init
    if (!hash) {
        document.getElementById('loading').innerHTML = "Error: Invalid Link (No Hash provided)";
    } else {
        fetchDetails(hash);
    }

    async function fetchDetails(infoHash) {
        try {
            // 🔥 核心逻辑：用 Hash 去搜，API 会返回包含该资源的数组
            const res = await fetch(`${API_BASE}/?q=${infoHash}`);
            const data = await res.json();
            
            if (!data || data.length === 0 || data.error) {
                throw new Error("Resource not found or deleted.");
            }

            // 通常按 Hash 搜只能搜到一个，取第一个
            const item = data[0];
            render(item);

        } catch (e) {
            document.getElementById('loading').innerHTML = `Failed to load details.<br>${e.message}`;
        }
    }

    function render(item) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // Update DOM
        document.title = `${item.name} - Download`; // SEO Title update
        
        // Dynamic Meta Description for SEO
        let metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute("content", `Download ${item.name}. Size: ${item.size}. Seeds: ${item.seeders}.`);

        document.getElementById('title').textContent = item.name;
        document.getElementById('size').textContent = item.size;
        document.getElementById('date').textContent = item.date;
        document.getElementById('seeders').textContent = item.seeders;
        document.getElementById('leechers').textContent = item.leechers;
        document.getElementById('downloads').textContent = item.downloads || 0;
        document.getElementById('infoHash').textContent = item.infohash;

        // Magnet
        document.getElementById('magnetBtn').href = item.magnet;
        document.getElementById('magnetRaw').textContent = item.magnet;

        // Robots tag: Allow indexing now content is loaded
        let robots = document.querySelector('meta[name="robots"]');
        if(robots) robots.setAttribute("content", "index, follow");
    }

    function copyMagnet() {
        const text = document.getElementById('magnetRaw').textContent.trim();
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        });
    }
</script>

</body>
</html>
